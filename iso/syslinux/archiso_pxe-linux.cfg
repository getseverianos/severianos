LABEL arch_nbd
TEXT HELP
Boot the SeverianOS install medium using NBD.
It allows you to install SeverianOS or perform system maintenance.
ENDTEXT
MENU LABEL SeverianOS install medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y %KERNEL_PARAMS% vt.default_red=18,181,127,201,107,154,111,216,70,208,153,221,132,179,136,236 vt.default_grn=18,82,154,166,130,122,154,210,68,106,180,189,155,147,179,231 vt.default_blu=20,59,101,107,153,160,150,198,74,80,125,133,178,185,174,221
SYSAPPEND 3


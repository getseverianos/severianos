# generated by sevconf — do not edit
# Change these values with sevsettings or: sevconf set look.accent 7f9a65
# Your own files in ~/.config/sway/config.d/ load after this one and win.
#
# These lines are NOT in the main config as well: a key bound twice makes
# Sway complain on every reload, and a value in two places is a value that
# drifts apart. This file owns them.

font pango:JetBrains Mono 10
default_border pixel 2
default_floating_border pixel 2
gaps inner 6
gaps outer 0
output * bg /usr/share/backgrounds/severian/fuligin.png fill #121214
seat * xcursor_theme Adwaita 24

#                       border     bg         text         indicator  child
client.focused          #b5523b  #b5523b  #e6e1d8  #c9a66b   #b5523b
client.focused_inactive #2a292e  #1c1b1f  #8a857c  #2a292e  #2a292e
client.unfocused        #1c1b1f  #1c1b1f  #6f6a62  #1c1b1f  #1c1b1f
client.urgent           #c9a66b  #c9a66b  #121214  #c9a66b  #c9a66b

input type:touchpad {
    tap enabled
    natural_scroll enabled
    dwt enabled
}
input type:keyboard {
    repeat_delay 600
    repeat_rate 25
}

## start | terminal
bindsym $mod+Return exec foot
bindsym $mod+t exec foot

## start | floating terminal
bindsym $mod+Shift+Return exec foot --app-id sev-float

## start | browser
bindsym $mod+Shift+b exec sevbrowser
bindsym Ctrl+b exec sevbrowser

# SeverianOS: settings for the dropdown terminal (sevdrop) only.
# Your own ~/.tmux.conf is not touched and not read here.
#
# The prefix is Ctrl+A, because Ctrl+B opens the browser in SeverianOS and
# never reaches tmux.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1
set -g history-limit 10000
set -sg escape-time 10
set -g status-style 'bg=#1c1b1f fg=#8a857c'
set -g status-left ' #[fg=#b5523b]●#[fg=#d8d2c6] #S '
set -g status-right ' #[fg=#6f6a62]Ctrl+A #[fg=#8a857c]%H:%M '
set -g window-status-current-style 'fg=#e6e1d8 bg=#b5523b'
set -g window-status-current-format ' #I #W '
set -g window-status-format ' #I #W '
set -g pane-border-style 'fg=#2a292e'
set -g pane-active-border-style 'fg=#b5523b'

# generated by sevconf — do not edit
# Change these values with sevsettings or: sevconf set look.accent 7f9a65
# Your own files in ~/.config/sway/config.d/ load after this one and win.
#
# These lines are NOT in the main config as well: a key bound twice makes
# Sway complain on every reload, and a value in two places is a value that
# drifts apart. This file owns them.

font pango:{{look.font}} {{look.font_size}}
default_border pixel {{look.border}}
default_floating_border pixel {{look.border}}
gaps inner {{look.gaps}}
gaps outer {{look.gaps_outer}}
output * bg {{look.wallpaper}} fill #{{look.bg}}
seat * xcursor_theme {{look.cursor_theme}} {{look.cursor_size}}

#                       border     bg         text         indicator  child
client.focused          #{{look.accent}}  #{{look.accent}}  #{{look.text_bright}}  #{{look.gold}}   #{{look.accent}}
client.focused_inactive #{{look.surface2}}  #{{look.surface}}  #{{look.muted3}}  #{{look.surface2}}  #{{look.surface2}}
client.unfocused        #{{look.surface}}  #{{look.surface}}  #{{look.muted}}  #{{look.surface}}  #{{look.surface}}
client.urgent           #{{look.gold}}  #{{look.gold}}  #{{look.bg}}  #{{look.gold}}  #{{look.gold}}

input type:touchpad {
    tap {{input.touchpad.tap}}
    natural_scroll {{input.touchpad.natural_scroll}}
    dwt {{input.touchpad.dwt}}
}
input type:keyboard {
    repeat_delay {{input.repeat_delay}}
    repeat_rate {{input.repeat_rate}}
}

## start | terminal
bindsym $mod+Return exec {{apps.terminal}}
bindsym $mod+t exec {{apps.terminal}}

## start | floating terminal
bindsym $mod+Shift+Return exec {{apps.terminal_floating}}

## start | browser
bindsym $mod+Shift+b exec {{apps.browser}}
bindsym Ctrl+b exec {{apps.browser}}

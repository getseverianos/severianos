# SeverianOS · fuzzel · Fuligin
[main]
font={{look.font}}:size={{look.menu_font_size}}
prompt="● "
icon-theme={{look.icon_theme}}
width=36
lines=8
horizontal-pad=18
vertical-pad=14
inner-pad=8
line-height=22
letter-spacing=0.3

[colors]
background={{look.bg}}f5
text={{look.text}}ff
prompt={{look.accent}}ff
placeholder={{look.muted2}}ff
input={{look.text_bright}}ff
match={{look.accent}}ff
selection={{look.line}}ff
selection-text={{look.text_bright}}ff
selection-match={{look.gold}}ff
border={{look.accent}}ff

[border]
width={{look.border}}
radius={{look.radius}}

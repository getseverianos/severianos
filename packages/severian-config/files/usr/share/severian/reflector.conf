# SeverianOS: fast, recent HTTPS mirrors. Used by reflector.timer (weekly)
# and by sevupdate when an update fails.
#
# This file is read through a drop-in for reflector.service. It does not live
# in /etc/xdg/reflector/, because that file belongs to the reflector package
# and two packages must never own the same file.
--save /etc/pacman.d/mirrorlist
--protocol https
--latest 20
--sort rate
--fastest 8
